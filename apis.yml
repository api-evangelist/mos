aid: mos
name: Mos
description: >-
  Mos is a consumer fintech that helps students find and win money for college. Founded in 2017 by
  Tunisian human-rights activist Amira Yahyaoui and backed by Sequoia Capital, Lux Capital and
  Expa, the company began as a financial-aid application service — FAFSA filing plus human advisor
  support — then added a fee-free student checking account and debit card in 2021. Mos shut the
  banking product down and cut staff in 2023 after press and investor scrutiny of its account
  metrics, refocusing on its original financial-aid business. The live product at mos.com is a
  scholarship-matching app: students swipe through awards drawn from a database the company
  describes as $160 billion in available funding, with college financial-planning tools and access
  to a personal advisor. Sequoia's own company page records Mos as acquired in 2025; the acquirer
  is not disclosed. Mos ships only an end-user consumer app — it publishes no developer portal, API
  documentation, SDK or machine-readable contract of any kind.
